# Alembic CLI configuration for FlowForge (optional convenience: the
# programmatic helpers in flowforge.db.migrate need no ini file).
#
#   FLOWFORGE_DATABASE_URL=postgresql+psycopg://user:pass@host:5432/db \
#       alembic -c backend/alembic.ini upgrade head
#
# The script location is inside the Python package (docs/architecture.md
# section 12). sqlalchemy.url is intentionally NOT set here: migrations/env.py
# reads FLOWFORGE_DATABASE_URL, so no credentials ever live in this file.
[alembic]
script_location = %(here)s/src/flowforge/db/migrations
prepend_sys_path = %(here)s/src
