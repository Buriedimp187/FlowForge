[project]
name = "flowforge"
version = "0.1.0.dev0"
description = "FlowForge backend: domain model and execution engine (M1)."
readme = "../README.md"
license = { text = "MIT" }
# Baseline series per ADR-0015 / docs/toolchain-versions.md. This range is
# intentionally permissive (3.13 through <3.16) rather than pinned to an
# exact patch, since no exact patch pin has been finalized yet -- see
# docs/toolchain-versions.md for why 3.14 is the selected baseline and
# the open item regarding its verification against this dependency set.
requires-python = ">=3.13,<3.16"

# M1's first (and, for this correction pass, only) third-party runtime
# dependency: JSON Schema Draft 2020-12 validation for node parameters
# (docs/architecture.md section 5, section 2.2), per the user-approved
# decision to implement full JSON Schema rather than a hand-rolled
# subset. Exact pin and the verification evidence behind it are recorded
# in requirements-lock.txt (no uv.lock exists yet, see
# docs/toolchain-versions.md) and in the M1 final-correction report.
dependencies = [
    "jsonschema==4.26.0",
]

[tool.pytest.ini_options]
# Not used to run M1's tests (no pytest is installed; see the M1
# completion report), kept only so a future `pip install pytest` + `pytest`
# works without extra configuration once that milestone chooses to add it.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
