# FlowForge CI.
#
# Documentation checks (M0) plus the backend test job (M2.1), which is the
# first job to run application code: the pure-engine unit tests and the
# PostgreSQL integration tests. Frontend, Docker-build and outbound-security
# jobs are added at the milestones that introduce them (docs/milestones.md).
#
# Third-party actions are pinned to a commit SHA (never a floating tag), and
# the PostgreSQL service image is pinned by tag AND digest, per
# docs/adr/0015-toolchain-baselines-and-pinning.md. No Dockerfile or Compose
# file is involved (docs/m2-persistence-design.md D3): the database is a
# `services:` container supplied by the runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository and documentation structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify required root files exist
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "LICENSE"
            ".gitignore"
            ".editorconfig"
            "docs/architecture.md"
            "docs/mvp-scope.md"
            "docs/milestones.md"
            "docs/risks-and-release-gates.md"
            "docs/toolchain-versions.md"
            "docs/message-catalog.md"
            "docs/adr/README.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Verify every ADR 0001-0018 exists and has an exact index link
        run: |
          set -euo pipefail
          missing=0
          for n in $(seq -w 1 18); do
            id="00${n}"
            files=$(ls docs/adr/ | grep -E "^${id}-.*\.md$" || true)
            count=$(echo "$files" | grep -c . || true)
            if [ "$count" -eq 0 ]; then
              echo "::error::No ADR file found matching prefix ${id}-"
              missing=1
              continue
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple ADR files match prefix ${id}-: $files"
              missing=1
              continue
            fi
            filename="$files"
            # Exact Markdown link match: "[0001](0001-modular-monolith.md)".
            # A substring grep on just the id would also match 0010-0018, so
            # this requires the full "[id](filename)" pair verbatim.
            link="[${id}](${filename})"
            if ! grep -qF -- "$link" docs/adr/README.md; then
              echo "::error::docs/adr/README.md does not contain the exact link ${link}"
              missing=1
            fi
          done
          exit $missing

      - name: Verify no unapproved infrastructure is referenced as required
        run: |
          set -euo pipefail
          # Redis/Celery/Kubernetes may legitimately be *mentioned* in docs as
          # explicitly rejected alternatives (e.g. "no Redis is used"), so this
          # is a human-reviewed signal, not a hard failure: it only reports
          # matches for visibility and never blocks the build on its own.
          echo "Scanning docs/ for mentions of infrastructure the architecture has not approved (informational only):"
          grep -rniE "redis|celery|kubernetes|k8s" docs/ || echo "  (no matches)"

      - name: Verify no AI-assistant attribution was added to project files
        run: |
          set -euo pipefail
          # This check necessarily names the banned phrases below, so it
          # excludes this workflow file itself (and the whole .github/
          # directory) to avoid matching its own source.
          pattern="generated by claude|co-authored-by: *claude|claude code"
          if grep -rliE "$pattern" \
               --include="*.md" \
               --exclude-dir=".git" \
               --exclude-dir=".github" \
               . ; then
            echo "::error::Found disallowed AI-assistant attribution in project files"
            exit 1
          fi
          echo "OK: no disallowed attribution found."

  markdown-lint:
    name: Markdown syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@5b7c9f74fec47e6b15667b2cc23c63dff11e449e # v9.0.0
        with:
          globs: |
            **/*.md
            !node_modules

  backend-tests:
    name: Backend tests (unit + PostgreSQL 17 integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must equal POSTGRES_IMAGE in backend/tests/integration/support.py
        # (checked by backend/tests/unit/test_toolchain_pins.py).
        image: postgres:17.12@sha256:dbb9623d5121b5d2c2c9e2fba56e40193cbb3510d4af7f035b1ab1823aff3205
        env:
          POSTGRES_USER: flowforge_test
          POSTGRES_PASSWORD: flowforge_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FLOWFORGE_TEST_DATABASE_URL: postgresql+psycopg://flowforge_test:flowforge_test@localhost:5432/postgres
      # The integration tests may never be silently skipped in CI.
      FLOWFORGE_REQUIRE_DB_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python (baseline series 3.14)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python --version
          pip install -r backend/requirements-lock.txt -r backend/requirements-dev-lock.txt
          pip check

      - name: Run unit and integration tests
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v

  # Placeholder for future expansion — intentionally not implemented yet.
  # Frontend lint/tests, import-linter boundary checks, Docker build, and
  # outbound-security test suites are added starting at the milestone that
  # introduces the corresponding code, per docs/milestones.md. This job exists
  # only so the workflow file documents that omission explicitly.
  future-application-checks:
    name: Application checks (frontend, Docker, outbound security - not yet implemented)
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "No frontend, Docker, or outbound-security code exists yet."
          echo "This job is a documented placeholder, not a passing test suite."
          echo "See docs/milestones.md for when each real check is introduced."
